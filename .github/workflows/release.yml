# v* etiketi gönderilince paneli derleyip hazır sürüm paketini GitHub Releases'a yükler.
# Telefondaki kurulum betiği (scripts/install.sh) en son sürümün paketini indirir.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: bash scripts/pack.sh
      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/termux-panel.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
